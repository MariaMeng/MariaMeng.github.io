<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 380" width="100%" role="img" aria-labelledby="title">
  <title id="title">海外借贷主业务过程总览</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <style type="text/css"><![CDATA[
      .title { fill: #6b7280; font: 11px system-ui, -apple-system, sans-serif; }
      .lane-title { fill: #111827; font: 600 12px system-ui, -apple-system, sans-serif; }
      .label { fill: #111827; font: 600 11px system-ui, -apple-system, sans-serif; }
      .lane-a { fill: #eff6ff; stroke: #2563eb; }
      .lane-b, .lane-c { fill: #f9fafb; stroke: #d1d5db; }
      .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1; }
      .box-accent { fill: #ffffff; stroke: #2563eb; stroke-width: 2; }
      .box-soft { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1; }
    ]]></style>
  </defs>

  <text class="title" x="20" y="24">海外借贷主业务过程总览（用户视角）</text>

  <rect class="lane-a" x="16" y="40" width="1048" height="90" rx="8" stroke-width="1.5"/>
  <text class="lane-title" x="28" y="62">A. 自营 App 借款</text>
  <g>
    <rect class="box" x="28" y="74" width="100" height="40" rx="5"/>
    <text class="label" x="78" y="98" text-anchor="middle">获客登录</text>
  </g>  <g>
    <rect class="box" x="148" y="74" width="100" height="40" rx="5"/>
    <text class="label" x="198" y="98" text-anchor="middle">完善资料</text>
  </g>  <g>
    <rect class="box-accent" x="268" y="74" width="100" height="40" rx="5"/>
    <text class="label" x="318" y="98" text-anchor="middle">授信审批</text>
  </g>  <g>
    <rect class="box" x="388" y="74" width="100" height="40" rx="5"/>
    <text class="label" x="438" y="98" text-anchor="middle">获得额度</text>
  </g>  <g>
    <rect class="box-accent" x="508" y="74" width="100" height="40" rx="5"/>
    <text class="label" x="558" y="98" text-anchor="middle">确认借款</text>
  </g>  <g>
    <rect class="box-accent" x="628" y="74" width="100" height="40" rx="5"/>
    <text class="label" x="678" y="98" text-anchor="middle">放款到账</text>
  </g>  <g>
    <rect class="box" x="748" y="74" width="100" height="40" rx="5"/>
    <text class="label" x="798" y="98" text-anchor="middle">按期还款</text>
  </g>  <g>
    <rect class="box" x="868" y="74" width="100" height="40" rx="5"/>
    <text class="label" x="918" y="98" text-anchor="middle">结清/复借</text>
  </g>  <line x1="128" y1="94" x2="148" y2="94" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="248" y1="94" x2="268" y2="94" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="368" y1="94" x2="388" y2="94" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="488" y1="94" x2="508" y2="94" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="608" y1="94" x2="628" y2="94" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="728" y1="94" x2="748" y2="94" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="848" y1="94" x2="868" y2="94" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect class="lane-b" x="16" y="146" width="1048" height="90" rx="8" stroke-width="1"/>
  <text class="lane-title" x="28" y="168">B. 贷超渠道借款</text>
  <g>
    <rect class="box-soft" x="28" y="180" width="110" height="40" rx="5"/>
    <text class="label" x="83" y="204" text-anchor="middle">渠道撞库</text>
  </g>  <g>
    <rect class="box-soft" x="158" y="180" width="110" height="40" rx="5"/>
    <text class="label" x="213" y="204" text-anchor="middle">渠道进件</text>
  </g>  <g>
    <rect class="box-accent" x="288" y="180" width="110" height="40" rx="5" fill="#f3f4f6"/>
    <text class="label" x="343" y="204" text-anchor="middle">授信/出额</text>
  </g>  <g>
    <rect class="box-accent" x="418" y="180" width="110" height="40" rx="5" fill="#f3f4f6"/>
    <text class="label" x="473" y="204" text-anchor="middle">渠道下单</text>
  </g>  <g>
    <rect class="box-soft" x="548" y="180" width="110" height="40" rx="5"/>
    <text class="label" x="603" y="204" text-anchor="middle">机构放款</text>
  </g>  <g>
    <rect class="box-soft" x="678" y="180" width="120" height="40" rx="5"/>
    <text class="label" x="738" y="204" text-anchor="middle">状态回推渠道</text>
  </g>  <g>
    <rect class="box-soft" x="818" y="180" width="120" height="40" rx="5"/>
    <text class="label" x="878" y="204" text-anchor="middle">渠道侧还款</text>
  </g>  <line x1="138" y1="200" x2="158" y2="200" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="268" y1="200" x2="288" y2="200" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="398" y1="200" x2="418" y2="200" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="528" y1="200" x2="548" y2="200" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="658" y1="200" x2="678" y2="200" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="798" y1="200" x2="818" y2="200" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect class="lane-c" x="16" y="252" width="1048" height="90" rx="8" stroke-width="1"/>
  <text class="lane-title" x="28" y="274">C. 贷后还款与逾期</text>
  <g>
    <rect class="box-soft" x="28" y="286" width="120" height="40" rx="5"/>
    <text class="label" x="88" y="310" text-anchor="middle">账单到期</text>
  </g>  <g>
    <rect class="box-accent" x="168" y="286" width="120" height="40" rx="5" fill="#f3f4f6"/>
    <text class="label" x="228" y="310" text-anchor="middle">主动还款</text>
  </g>  <g>
    <rect class="box-soft" x="308" y="286" width="120" height="40" rx="5"/>
    <text class="label" x="368" y="310" text-anchor="middle">支付成功入账</text>
  </g>  <line x1="148" y1="306" x2="168" y2="306" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="288" y1="306" x2="308" y2="306" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>  <text class="title" x="460" y="310">或</text>  <g>
    <rect class="box-accent" x="490" y="286" width="120" height="40" rx="5" fill="#f3f4f6"/>
    <text class="label" x="550" y="310" text-anchor="middle">逾期</text>
  </g>  <g>
    <rect class="box-soft" x="630" y="286" width="120" height="40" rx="5"/>
    <text class="label" x="690" y="310" text-anchor="middle">催收跟进</text>
  </g>  <g>
    <rect class="box-soft" x="770" y="286" width="120" height="40" rx="5"/>
    <text class="label" x="830" y="310" text-anchor="middle">代扣/重组</text>
  </g>  <g>
    <rect class="box-soft" x="910" y="286" width="120" height="40" rx="5"/>
    <text class="label" x="970" y="310" text-anchor="middle">结清或核销</text>
  </g>  <line x1="610" y1="306" x2="630" y2="306" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="750" y1="306" x2="770" y2="306" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="890" y1="306" x2="910" y2="306" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
